name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test Lones.SptManager.slnx -c Release --nologo

      - name: Publish win-x64
        run: >
          dotnet publish src/Lones.SptManager.App/Lones.SptManager.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath LonesSptManager-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LonesSptManager-win-x64
          path: LonesSptManager-win-x64.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            LonesSptManager-win-x64.zip
            publish/LonesSptManager.exe
